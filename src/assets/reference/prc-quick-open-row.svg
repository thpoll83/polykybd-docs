<text x="30" y="210" fill="#ff8c00" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif">Column 4: neighbours 1–10 read 1110101101 = context 941; table byte 2, so P(set) = 1 − 2/256 = 99.2%.</text>
<text x="30" y="230" fill="#e8e8e8" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif">The pixel is set: code length −log₂ 0.992 = 0.011 bits.</text>
<text x="30" y="250" fill="#e8e8e8" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif">Whole row: 27 pixels, 11.9 bits of information; uncoded, 27 bits.</text>
<text x="30" y="270" fill="#9aa0aa" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif">white outline = set pixel; number in a cell = its code length in bits</text>
