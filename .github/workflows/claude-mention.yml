# Interactive Claude, triggered by mentioning @claude in a PR or issue comment.
#
# Companion to claude-review.yml. That one runs a full review; this one answers
# a specific question or makes a specific change, and only when asked.
#
# What it earns its keep for in a DOCS repo:
#
#   @claude does the Multi-Machine page still match the shipped default?
#   @claude is CodeRabbit right that <finding>? check it against the page
#   @claude this page describes host 0.12 behaviour — which release shipped it?
#
# That last one is the local hazard worth naming: merging a page here SHIPS it
# within minutes (deploy.yml runs on push to main), while a host feature only
# reaches users on a published release. So a docs PR can put the live site ahead
# of the newest release, or leave it behind a default that flipped. See
# CLAUDE.md — this runs with the repo checked out and that file loaded.
#
# Runs are billed to the CLAUDE_CODE_OAUTH_TOKEN owner's Claude subscription.
# Only users with write access can trigger it, and bot accounts cannot — so a
# rate-limit notice from another reviewer can never set this off by itself.
#
# NOTE: comment triggers always run the copy of this file on the DEFAULT
# branch, so this workflow does nothing until it is merged there.
name: Claude (@claude mention)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # "@claude review" belongs to claude-review.yml; excluding it here is what
    # stops one comment from starting two runs.
    # Mirrors claude-review.yml's startsWith exactly, so the two cannot both
    # fire and no "@claude ..." comment can fall between them.
      # ⚠️ Actor guard: runs bill to the CLAUDE_CODE_OAUTH_TOKEN owner's Claude
      # subscription, so a trigger is a spend. The action already rejects
      # non-write users and bot actors BEFORE any model request (visible in the
      # run log as "Actor has write access" / "Verified human actor"), so a
      # passer-by commenting on a public PR cannot spend anything. This pins it
      # to a named account as well, so granting someone write access for an
      # unrelated reason does not silently hand them the subscription too.
      # To let someone else summon it, add their login here.
    if: >-
      github.actor == 'thpoll83' &&
      contains(github.event.comment.body, '@claude') &&
      !startsWith(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read      # lets Claude read the deploy workflow's results
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRE-EMPTIVE, and deliberately kept even though it is currently a
          # no-op: this repository has no .claude/settings.json today. See the
          # longer note in claude-review.yml for the mechanism — in short, the
          # action loads settingSources ["user","project","local"], so adding
          # one later would apply its allow-list inside the runner, where an
          # unlisted tool is DENIED rather than prompted.
          #
          # Here the result would be worse than silence: this workflow CAN post
          # (it holds issues/pull-requests write), so without these tools it
          # would answer a question about the docs having read none of them.
          #
          # `Bash(gh:*)` and `Bash(git:*)` are deliberately broad: narrowing
          # either to the subcommands used today re-arms exactly this silent
          # failure the next time another is needed. The git glob replaced a
          # narrow `git diff/log/show` list that cost the review workflow a
          # whole run — see the longer note in claude-review.yml. ⚠️ Unlike the
          # review job, this one DOES hold write permissions, so the actor guard
          # above is what bounds it.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git:*)",
                  "Read",
                  "Glob",
                  "Grep"
                ]
              }
            }
          # Runaway backstop; see the note in claude-review.yml. Answering a
          # question needs fewer turns than reviewing a diff.
          claude_args: |
            --max-turns 30
